
name: Build IMDD 26.2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Compilar mod
        run: ./gradlew build --no-daemon

      - name: Compactar mod
        run: |
          mkdir -p release
          cp build/libs/*.jar release/

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: IMDD-26.2
          path: release/*.jar
          if-no-files-found: error
